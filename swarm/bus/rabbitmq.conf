# Import au demarrage de tous les .json du dossier : topologie (config) + utilisateurs (secret).
# Avec un import de definitions, RabbitMQ ne cree PAS d'utilisateur par defaut.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions
# Sans cela, RabbitMQ calcule son seuil memoire sur la RAM de la VM, pas sur la limite du conteneur.
total_memory_available_override_value = 400MB
