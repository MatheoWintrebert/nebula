# Construit, analyse, tague et publie les images a chaque push sur main.
# Tag immuable : <VERSION>-<sha7>. Une image avec une faille CRITIQUE corrigeable n'est pas publiee.
name: build

on:
  push:
    branches: [main]
    paths: ["services/**", "VERSION", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Un dossier services/<nom>/ = une image : ajouter un service ne modifie pas ce fichier.
  liste:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.ls.outputs.services }}
    steps:
      - uses: actions/checkout@v7
      - id: ls
        run: echo "services=$(find services -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  image:
    needs: liste
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.liste.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: |
          echo "tag=$(cat VERSION)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nebula-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build
        uses: docker/build-push-action@v7
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: analyse de vulnerabilites (bloquante)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: push
        run: docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: resume
        run: echo "### ${{ matrix.service }} -> \`${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
