# Scenario 8 : image comptes dont le healthcheck echoue toujours.
name: defect

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag sain de depart (<VERSION>-<sha7>)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  comptes:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - run: '[[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{7}$ ]]'
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nebula-comptes"
          printf 'FROM %s:%s\nHEALTHCHECK --interval=5s --start-period=10s --retries=2 CMD ["false"]\n' "$IMG" "$TAG" |
            docker build -t "$IMG:$TAG-defect" -
          docker push "$IMG:$TAG-defect"
          echo "### image defectueuse : \`$IMG:$TAG-defect\`" >> "$GITHUB_STEP_SUMMARY"
